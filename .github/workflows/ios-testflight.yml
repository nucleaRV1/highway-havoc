# Builds the iOS app on a GitHub-hosted Mac and uploads it to App Store Connect (TestFlight).
# Run it from the repo's Actions tab: "iOS build" > "Run workflow".
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   APPSTORE_TEAM_ID      10-character Apple Developer Team ID
#   APPSTORE_KEY_ID       App Store Connect API key ID
#   APPSTORE_ISSUER_ID    App Store Connect API issuer ID
#   APPSTORE_API_KEY_P8   Full text of the AuthKey_XXXXXXXXXX.p8 file
#
# Signing is fully automatic: Xcode uses the API key to create and manage
# certificates and provisioning profiles in Apple's cloud, so none are stored here.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect / TestFlight (off = build the .ipa only)
        type: boolean
        default: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check secrets are set
        env:
          P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          missing=""
          for v in TEAM_ID KEY_ID ISSUER_ID P8; do [ -z "${!v}" ] && missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Build web assets and sync into the iOS project
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Install App Store Connect API key
        env:
          P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$P8" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Set version and build number
        run: |
          echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          # Every upload needs a higher build number than the last
          echo "BUILD_NUMBER=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export and upload
        run: |
          DEST=${{ inputs.upload && 'upload' || 'export' }}
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Version $APP_VERSION ($BUILD_NUMBER) - destination: $DEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the .ipa as a download
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: HighwayHavoc-ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
